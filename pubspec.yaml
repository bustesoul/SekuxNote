name: sekuxnote
description: "SekuxNote AI voice recording and meeting notes."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  cryptography: ^2.7.0
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_foreground_task: ^10.0.0
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: any
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  record: ^6.2.1
  sqflite_common_ffi: ^2.4.0+2
  web_socket_channel: ^3.0.3
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

# Use the operating system SQLite library. This keeps desktop builds independent
# from downloading a precompiled SQLite binary during build.
hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3
