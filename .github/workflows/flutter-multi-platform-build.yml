name: Flutter Multi-Platform Build Stable 3.44

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 构建 Android APK
        required: false
        default: true
        type: boolean
      build_ios:
        description: 构建未签名 iOS IPA
        required: false
        default: true
        type: boolean
      build_macos:
        description: 构建未签名 macOS DMG
        required: false
        default: true
        type: boolean
      build_windows:
        description: 构建 Windows ZIP 和安装程序
        required: false
        default: true
        type: boolean
      build_linux:
        description: 构建 Linux tar.gz、AppImage、DEB 和 RPM
        required: false
        default: true
        type: boolean
      publish_release:
        description: 将产物发布到 GitHub Release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release 标签（例如 v0.1.0，发布时必填）
        required: false
        default: ''
        type: string
      prerelease:
        description: 标记为预发布版本
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: '3.44.1'

permissions:
  contents: read

jobs:
  prepare:
    name: 准备构建信息
    runs-on: ubuntu-latest
    outputs:
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验参数并读取版本
        id: version
        shell: bash
        env:
          BUILD_ANDROID: ${{ inputs.build_android }}
          BUILD_IOS: ${{ inputs.build_ios }}
          BUILD_MACOS: ${{ inputs.build_macos }}
          BUILD_WINDOWS: ${{ inputs.build_windows }}
          BUILD_LINUX: ${{ inputs.build_linux }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_ANDROID" != 'true' && "$BUILD_IOS" != 'true' && \
                "$BUILD_MACOS" != 'true' && "$BUILD_WINDOWS" != 'true' && \
                "$BUILD_LINUX" != 'true' ]]; then
            echo '至少需要选择一个构建平台。' >&2
            exit 1
          fi
          if [[ "$PUBLISH_RELEASE" == 'true' && -z "$RELEASE_TAG" ]]; then
            echo '发布 Release 时必须填写 release_tag。' >&2
            exit 1
          fi

          raw_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '[:space:]')"
          if [[ -z "$raw_version" ]]; then
            echo '未能从 pubspec.yaml 读取 version。' >&2
            exit 1
          fi
          version_name="${raw_version%%+*}"
          if [[ "$raw_version" == *'+'* ]]; then
            build_number="${raw_version##*+}"
          else
            build_number='1'
          fi
          artifact_version="${raw_version//+/_}"
          if [[ "$PUBLISH_RELEASE" != 'true' ]]; then
            artifact_version="${artifact_version}_$(git rev-parse --short HEAD)"
          fi

          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "产物版本：$artifact_version"

  android:
    name: 构建 Android
    if: ${{ inputs.build_android }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
      SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 配置可选的 Android 正式签名
        if: ${{ env.SIGN_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:?缺少 KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?缺少 KEY_ALIAS}"
          : "${KEY_PASSWORD:?缺少 KEY_PASSWORD}"
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo 'storeFile=upload-keystore.jks'
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: 获取依赖
        run: flutter pub get

      - name: 构建分架构 APK
        run: flutter build apk --release --split-per-abi

      - name: 整理 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$file" | sed -E 's/app-(.*)-release\.apk/\1/')"
            cp "$file" "dist/android/SekuxNote_android_${ARTIFACT_VERSION}_${abi}.apk"
          done

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: 构建 iOS（未签名）
    if: ${{ inputs.build_ios }}
    needs: prepare
    runs-on: macos-latest
    env:
      ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 使用 CocoaPods 依赖模式
        run: flutter config --no-enable-swift-package-manager

      - name: 获取依赖
        run: flutter pub get

      - name: 构建未签名 iOS 应用
        run: flutter build ios --release --no-codesign

      - name: 打包未签名 IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ios/Payload
          cp -R build/ios/iphoneos/Runner.app dist/ios/Payload/
          cd dist/ios
          zip -qry "SekuxNote_ios_${ARTIFACT_VERSION}_unsigned.ipa" Payload
          rm -rf Payload

      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: iOS-unsigned-IPA
          path: dist/ios/*.ipa
          if-no-files-found: error
          retention-days: 14

  macos:
    name: 构建 macOS（未签名）
    if: ${{ inputs.build_macos }}
    needs: prepare
    runs-on: macos-latest
    env:
      ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 使用 CocoaPods 依赖模式
        run: flutter config --no-enable-swift-package-manager

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 macOS 应用
        run: flutter build macos --release

      - name: 创建未签名 DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/macos
          hdiutil create \
            -volname SekuxNote \
            -srcfolder build/macos/Build/Products/Release/SekuxNote.app \
            -ov \
            -format UDZO \
            "dist/macos/SekuxNote_macos_${ARTIFACT_VERSION}_unsigned.dmg"

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macOS-unsigned-DMG
          path: dist/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: 构建 Windows
    if: ${{ inputs.build_windows }}
    needs: prepare
    runs-on: windows-latest
    env:
      ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Windows 应用
        run: flutter build windows --release

      - name: 创建 ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist/windows' | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "dist/windows/SekuxNote_windows_${env:ARTIFACT_VERSION}.zip"

      - name: 安装 Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: 创建 Windows 安装程序
        shell: pwsh
        run: |
          $issContent = @"
          #define MyAppName "SekuxNote"
          #define MyAppVersion "$env:ARTIFACT_VERSION"
          #define MyAppExeName "sekuxnote.exe"

          [Setup]
          AppId={{B45EAFF2-5F57-4E0A-84C7-D04F1AE44E03}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=SekuxNote
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir=dist\windows
          OutputBaseFilename=SekuxNote_windows_{#MyAppVersion}_setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\{#MyAppExeName}

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch {#MyAppName}"; Flags: nowait postinstall skipifsilent
          "@
          $issContent | Out-File -FilePath installer.iss -Encoding utf8BOM
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Packages
          path: |
            dist/windows/*.zip
            dist/windows/*_setup.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: 构建 Linux
    if: ${{ inputs.build_linux }}
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
      VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 构建与打包依赖
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsqlite3-dev pulseaudio-utils ffmpeg \
            rpm patchelf libfuse2 file

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Linux 应用
        run: flutter build linux --release

      - name: 创建 tar.gz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/linux
          tar -C build/linux/x64/release/bundle -czf \
            "dist/linux/SekuxNote_linux_${ARTIFACT_VERSION}_x86_64.tar.gz" .

      - name: 创建 AppImage
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o appimagetool
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -R build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png AppDir/sekuxnote.png
          cp AppDir/sekuxnote.png AppDir/usr/share/icons/hicolor/256x256/apps/sekuxnote.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          APPDIR="$(dirname "$(readlink -f "$0")")"
          exec "$APPDIR/usr/bin/sekuxnote" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/sekuxnote.desktop <<'EOF'
          [Desktop Entry]
          Name=SekuxNote
          Exec=sekuxnote
          Icon=sekuxnote
          Type=Application
          Categories=AudioVideo;Utility;
          EOF
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool \
            AppDir "dist/linux/SekuxNote_linux_${ARTIFACT_VERSION}_x86_64.AppImage"

      - name: 创建 DEB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            deb/DEBIAN \
            deb/opt/sekuxnote \
            deb/usr/bin \
            deb/usr/share/applications \
            deb/usr/share/icons/hicolor/256x256/apps
          cp -R build/linux/x64/release/bundle/. deb/opt/sekuxnote/
          cat > deb/usr/bin/sekuxnote <<'EOF'
          #!/bin/bash
          exec /opt/sekuxnote/sekuxnote "$@"
          EOF
          chmod +x deb/usr/bin/sekuxnote
          cat > deb/usr/share/applications/sekuxnote.desktop <<'EOF'
          [Desktop Entry]
          Name=SekuxNote
          Exec=sekuxnote
          Icon=sekuxnote
          Type=Application
          Categories=AudioVideo;Utility;
          EOF
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png \
            deb/usr/share/icons/hicolor/256x256/apps/sekuxnote.png
          cat > deb/DEBIAN/control <<EOF
          Package: sekuxnote
          Version: ${VERSION_NAME}-${BUILD_NUMBER}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: SekuxNote
          Depends: libc6, libstdc++6, libgtk-3-0, libsqlite3-0, pulseaudio-utils, ffmpeg
          Description: Local-first AI voice recording and meeting notes
          EOF
          dpkg-deb --build deb \
            "dist/linux/SekuxNote_linux_${ARTIFACT_VERSION}_amd64.deb"

      - name: 创建 RPM
        shell: bash
        run: |
          set -euo pipefail
          rpm_root="$HOME/rpmbuild"
          mkdir -p "$rpm_root"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          source_dir="sekuxnote-${VERSION_NAME}"
          mkdir -p "$source_dir"
          cp -R build/linux/x64/release/bundle/. "$source_dir/"
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png \
            "$source_dir/sekuxnote.png"
          tar -czf "$rpm_root/SOURCES/${source_dir}.tar.gz" "$source_dir"
          cat > "$rpm_root/SPECS/sekuxnote.spec" <<EOF
          Name: sekuxnote
          Version: ${VERSION_NAME}
          Release: ${BUILD_NUMBER}%{?dist}
          Summary: Local-first AI voice recording and meeting notes
          License: Proprietary
          Source0: %{name}-%{version}.tar.gz
          BuildArch: x86_64
          Requires: gtk3, sqlite-libs, pulseaudio-utils, ffmpeg

          %description
          SekuxNote is a local-first AI voice recording and meeting notes app.

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}/opt/sekuxnote
          cp -a . %{buildroot}/opt/sekuxnote/
          mkdir -p %{buildroot}/usr/bin
          cat > %{buildroot}/usr/bin/sekuxnote <<'WRAPPER'
          #!/bin/bash
          exec /opt/sekuxnote/sekuxnote "\$@"
          WRAPPER
          chmod +x %{buildroot}/usr/bin/sekuxnote
          mkdir -p %{buildroot}/usr/share/applications
          cat > %{buildroot}/usr/share/applications/sekuxnote.desktop <<'DESKTOP'
          [Desktop Entry]
          Name=SekuxNote
          Exec=sekuxnote
          Icon=sekuxnote
          Type=Application
          Categories=AudioVideo;Utility;
          DESKTOP
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp sekuxnote.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/sekuxnote.png

          %files
          /opt/sekuxnote
          /usr/bin/sekuxnote
          /usr/share/applications/sekuxnote.desktop
          /usr/share/icons/hicolor/256x256/apps/sekuxnote.png
          EOF
          rpmbuild -bb "$rpm_root/SPECS/sekuxnote.spec"
          cp "$rpm_root"/RPMS/x86_64/sekuxnote-*.rpm \
            "dist/linux/SekuxNote_linux_${ARTIFACT_VERSION}_x86_64.rpm"

      - name: 检查 Linux 包
        shell: bash
        run: |
          set -euo pipefail
          test -x build/linux/x64/release/bundle/sekuxnote
          dpkg-deb --info dist/linux/*.deb
          rpm -qp --info dist/linux/*.rpm

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Packages
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 GitHub Release
    needs: [prepare, android, ios, macos, windows, linux]
    if: >-
      ${{
        always() &&
        inputs.publish_release &&
        inputs.release_tag != '' &&
        needs.prepare.result == 'success' &&
        (!inputs.build_android || needs.android.result == 'success') &&
        (!inputs.build_ios || needs.ios.result == 'success') &&
        (!inputs.build_macos || needs.macos.result == 'success') &&
        (!inputs.build_windows || needs.windows.result == 'success') &&
        (!inputs.build_linux || needs.linux.result == 'success')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: release-assets/**/*
